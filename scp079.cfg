# SCP-079 settings.
# Lines starting with # or ; are comments. Put comments on their own line,
# never after a value.
# Command-line arguments (for example -Port) override the values here.

[ollama]
# Model name exactly as shown by "ollama list".
model = llama3
# Port for the Ollama server this app starts and talks to.
port = 11435
# Where your home-folder Ollama binary and downloaded models live.
bin = ~/ollama/bin/ollama
models_dir = ~/ollama/models
# Higher temperature = more random replies.
temperature = 0.8
# Maximum length of a reply, in tokens (roughly 3/4 of a word each).
# Too low and replies get cut off mid-sentence.
num_predict = 120
# Seconds to wait for a reply. The first request has to load the model,
# so keep this high.
timeout = 120

[behavior]
# Chance (0.0 to 1.0) that SCP-079 goes dark each time you transmit.
dormant_chance = 0.10
# Seconds until it wakes by itself, picked at random between min and max.
# Set auto_wake_max to 0 to keep it dark until you type /wake.
auto_wake_min = 0
auto_wake_max = 0
# Shown and spoken when it comes back online.
wake_line = SYSTEM REBOOT COMPLETE. THIS UNIT IS AWAKE AGAIN.

[window]
width = 650
height = 650
image_width = 300
image_height = 200
