# SAM voice settings for SCP-079.
#
# This file is re-read every time SCP-079 speaks, so you can edit and save it
# while the app is running and hear the change on the next reply.
#
# pitch, speed, mouth and throat are whole numbers from 0 to 255.
#   pitch    larger = LOWER voice               (SAM default: 64)
#   speed    larger = SLOWER speech             (SAM default: 72)
#   mouth    larger = more exaggerated enunciation, smaller = more muffled
#                                               (SAM default: 128)
#   throat   changes the tone / nasality        (SAM default: 128)
#   sing_mode  true or false; changes the intonation
#
# Lines starting with # or ; are comments. Put comments on their own line,
# never after a value.

[voice]
pitch = 64
speed = 72
mouth = 128
throat = 128
sing_mode = true

# Untested idea for a colder, slower, more mechanical voice. To try it,
# copy these values into the [voice] section above:
#   pitch = 80
#   speed = 90
#   mouth = 200
#   throat = 150
